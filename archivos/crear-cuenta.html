<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../estilo.css">
</head>
<body>

<div class="pagina-acceso">
  <h1>Crear cuenta</h1>

  <div class="tarjeta-acceso">
    <span>SOFA_REPO · registro</span>

    <form action="" method="POST">
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>

      <div class="campo">
        <label for="usuario">Nombre de usuario</label>
        <input type="text" id="usuario" name="usuario" required>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>
      </div>

      <div class="campo-grupo">
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="campo">
          <label for="password_confirm">Confirmar contraseña</label>
          <input type="password" id="password_confirm" name="password_confirm" required>
        </div>
      </div>

      <button type="submit" class="boton">Crear cuenta</button>
    </form>
  </div>

  <p class="enlace-secundario">¿Ya tienes cuenta? <a href="iniciar-sesion.html">Inicia sesión</a></p>
</div>

</body>
</html>
