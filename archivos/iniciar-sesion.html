<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../estilo.css">
</head>
<body>

<div class="pagina-acceso">
  <h1>Iniciar sesión</h1>

  <div class="tarjeta-acceso">
    <span>SOFA_REPO · acceso</span>

    <!-- CONECTOR: aquí va el action/method o script que valida el usuario -->
    <form action="" method="POST">

      <div class="campo">
        <label for="usuario">Usuario o correo electrónico</label>
        <input type="text" id="usuario" name="usuario" required>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>

      <label class="campo-casilla">
        <input type="checkbox" name="recordar">
        Mantener la sesión iniciada
      </label>

      <button type="submit" class="boton">Entrar</button>
    </form>
  </div>

  <p class="enlace-secundario">
    <a href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a><br>
    ¿No tienes cuenta? <a href="crear-cuenta.html">Regístrate</a>
  </p>
</div>

</body>
</html>
